    <!-- Google Analytics (GA4) Boostrap & Telemetry Interface Tag -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TELEMETRY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TELEMETRY', { 'anonymize_ip': true });
      // Event tracker helper for console debugging
      window.logCustomTelemetry = function(eventName, eventParams) {
        console.log(`[GA4 telemetry Event: "${eventName}"]`, eventParams);
        if (typeof gtag === 'function') {
          gtag('event', eventName, eventParams);
        }
      };
    </script>
